[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nitrotrace"
version = "0.3.1"
description = "Contamination accounting for electrochemical ammonia: what remains unbounded, and what would close the gap."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.8"]

[project.optional-dependencies]
web = ["marimo>=0.25", "anywidget>=0.9"]
api = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
pdf = ["pymupdf>=1.24"]
llm = ["anthropic"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
nitrotrace = "app.cli:main"

[tool.setuptools]
# data/ ships inside the package as app/data, so a regular (non-editable) install finds the records.
packages = ["app", "app.data"]
package-dir = { "app" = "app", "app.data" = "data" }

[tool.setuptools.package-data]
"app" = ["static/*"]
"app.data" = ["cases/*.json", "synthetic/*.json", "protocols/*.json"]
